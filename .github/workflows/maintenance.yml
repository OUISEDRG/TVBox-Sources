name: Configuration checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tvbox-maintenance
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sync.py --check
      - run: python3 scripts/test.py
      - run: python3 scripts/health.py
# Enable scheduled writes only after the network and publication pipeline is reviewed.
