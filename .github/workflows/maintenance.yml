name: TVBox maintenance
on:
  push:
    branches: [main]
    paths: ['scripts/**', 'config/**', '.github/workflows/maintenance.yml', 'preview.json', 'tvbox.json', 'sources/**']
  schedule:
    - cron: '30 20 * * *'
    - cron: '0 2,14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Maintenance mode
        type: choice
        options: [check, sync, health, preview, build, full]
        default: full
permissions:
  contents: read
concurrency:
  group: tvbox-maintenance
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 scripts/sync.py --check
      - run: python3 scripts/test.py
      - name: Live read-only maintenance verification
        if: github.event_name == 'push'
        run: python3 scripts/health.py --mode full --dry-run
  maintain:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'check'))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - name: Run frozen roster maintenance
        env:
          MODE: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -eu
          if [ "$SCHEDULE" = "30 20 * * *" ]; then MODE=health; fi
          if [ "$SCHEDULE" = "0 2,14 * * *" ]; then MODE=sync; fi
          python3 scripts/sync.py --check
          python3 scripts/test.py
          case "$MODE" in
            sync|health|full) python3 scripts/health.py --mode "$MODE" ;;
            preview|build) python3 scripts/sync.py --check ;;
            *) exit 1 ;;
          esac
          python3 scripts/sync.py --check
          python3 scripts/test.py
          git diff --exit-code -- . ':!reports/health.json'
      - name: Publish report only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git add -- reports/health.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: frozen roster maintenance report'
          gh auth setup-git
          git push origin HEAD:main
